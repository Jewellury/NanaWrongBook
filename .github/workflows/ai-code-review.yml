name: AI Code Review (OCR)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # OCR 需要完整 git 历史做 diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Open Code Review
        run: npm install -g @alibaba-group/open-code-review

      - name: Configure & Test LLM
        id: llm-test
        continue-on-error: true
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
          OCR_USE_ANTHROPIC: 'false'
        run: ocr llm test

      - name: Fetch base branch
        run: git fetch origin main:refs/remotes/origin/main

      - name: Run AI Code Review
        id: review
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
          OCR_USE_ANTHROPIC: 'false'
        run: |
          ocr review \
            --from "origin/main" \
            --to "origin/${{ github.head_ref }}" \
            --format text \
            --exclude "node_modules/**,.next/**,data/**,playwright-report/**,test-results/**,study/**" \
            --audience human \
            > review-output.txt 2>&1
          cat review-output.txt

      - name: Post review as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s review-output.txt ]; then
            {
              echo "## 🤖 AI Code Review (OCR)"
              echo ""
              echo "Automated review by [Open Code Review](https://github.com/alibaba/open-code-review) powered by DeepSeek."
              echo ""
              cat review-output.txt
            } | gh pr comment ${{ github.event.pull_request.number }} \
              --body-file - \
              --repo ${{ github.repository }}
          fi
